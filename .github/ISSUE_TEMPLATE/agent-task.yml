name: Agent task
description: Scoped, testable task for Codex
title: "[Agent] "
labels: ["agent-ready"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user-visible behavior should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include observable and testable outcomes.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Out of scope / restrictions
    validations:
      required: true
